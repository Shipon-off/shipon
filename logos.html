<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SH Monogram Concepts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 4rem 2rem;
            text-align: center;
        }
        h1 { 
            font-weight: 900; 
            margin-bottom: 0.5rem; 
            font-size: 2.5rem;
            letter-spacing: -1px;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 4rem;
            font-size: 1.1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 4rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border-color: rgba(0,0,0,0.1);
        }
        .logo-container {
            width: 96px;
            height: 96px;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container svg {
            width: 100%;
            height: 100%;
        }
        .concept-name {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>

    <!-- Favicon and App Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <h1>Luxury Monogram Concepts</h1>
    <p class="subtitle">Pure SVG vector concepts for billion-dollar tech startup vibes.</p>
    
    <div class="grid">
        <!-- Concept 1: The Linear/Vercel Vibe -->
        <div class="card">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25 25 h 50 v 25 h -50 v 25 h 50" />
                    <path d="M50 25 v 50" />
                </svg>
            </div>
            <div class="concept-name">01 / Geometric Core</div>
        </div>

        <!-- Concept 2: The Notion Vibe -->
        <div class="card">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <path d="M75 25 H 25 V 50 H 75 V 75 H 25" />
                    <path d="M25 25 V 75 M75 25 V 75" />
                </svg>
            </div>
            <div class="concept-name">02 / Ribbon Loop</div>
        </div>

        <!-- Concept 3: The Stripe Vibe (Negative Space) -->
        <div class="card" style="background: #0f172a;">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- S cut out -->
                    <path d="M80 30 C 80 15, 20 15, 20 30 C 20 50, 80 50, 80 70 C 80 85, 20 85, 20 70" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
                    <!-- H overlay -->
                    <path d="M35 20 v 60 M65 20 v 60" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
                </svg>
            </div>
            <div class="concept-name" style="color: #94a3b8;">03 / Dark Contrast</div>
        </div>

        <!-- Concept 4: The Abstract Tech Vibe -->
        <div class="card">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M30 40 h 15 v 20 h -15 z" fill="#0f172a"/>
                    <path d="M55 40 h 15 v 20 h -15 z" fill="#0f172a"/>
                    <path d="M40 45 h 20" stroke="#0f172a" stroke-width="6" />
                </svg>
            </div>
            <div class="concept-name">04 / Isometric Base</div>
        </div>

        <!-- Concept 5: The OpenAI Vibe -->
        <div class="card">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" fill="#0f172a" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="25" cy="25" r="8" />
                    <circle cx="75" cy="25" r="8" />
                    <circle cx="25" cy="50" r="8" />
                    <circle cx="75" cy="50" r="8" />
                    <circle cx="25" cy="75" r="8" />
                    <circle cx="75" cy="75" r="8" />
                    <path d="M25 25 h50 l-50 25 h50 l-50 25 h50" fill="none" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M25 25 v50 M75 25 v50" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="concept-name">05 / Constellation</div>
        </div>

        <!-- Concept 6: The Modern Minimalist Vibe -->
        <div class="card">
            <div class="logo-container">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <text x="48" y="72" font-family="'Inter', sans-serif" font-weight="900" font-size="68" fill="#0f172a" text-anchor="middle" letter-spacing="-5">SH</text>
                    <circle cx="88" cy="70" r="8" fill="#0ea5e9" />
                </svg>
            </div>
            <div class="concept-name">06 / Typographic Bold</div>
        </div>
    </div>
</body>
</html>
